const u = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function open_(pw){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:u(P.s), iterations:P.n, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:u(P.i)}, key, u(P.c));
  try { sessionStorage.setItem("f8-pw", pw); } catch(e){}
  const html = new TextDecoder().decode(pt);
  document.open(); document.write(html); document.close();
}
document.getElementById("f").addEventListener("submit", e => {
  e.preventDefault();
  document.getElementById("err").textContent = "";
  open_(document.getElementById("pw").value).catch(() => { document.getElementById("err").textContent = "Forkert adgangskode."; });
});
let saved = null; try { saved = sessionStorage.getItem("f8-pw"); } catch(e){}
if (saved) open_(saved).catch(() => { try { sessionStorage.removeItem("f8-pw"); } catch(e){} });
